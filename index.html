<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Grid Knockout - Lucky Battle</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: #1a1a2e; color: #fff; display: flex; flex-direction: column; align-items: center; min-height: 100vh; overflow-x: hidden; padding: 10px; }
        h1 { margin: 10px 0; color: #e94560; text-shadow: 0 0 10px rgba(233,69,96,0.5); font-size: 1.8rem; }
        
        .setup-container { background: #16213e; padding: 20px; border-radius: 12px; max-width: 500px; width: 100%; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; color: #00fff5; }
        input, select { width: 100%; padding: 10px; border-radius: 6px; border: 1px solid #0f3460; background: #0f3460; color: #fff; font-size: 1rem; }
        
        button.btn-main { width: 100%; padding: 12px; background: #e94560; color: #fff; border: none; border-radius: 6px; font-size: 1.1rem; font-weight: bold; cursor: pointer; transition: 0.2s; margin-top: 10px; }
        button.btn-main:active { transform: scale(0.98); background: #cc344d; }
        
        .game-layout { display: flex; flex-direction: column; align-items: center; gap: 10px; width: 100%; max-width: 900px; }
        .top-bar { display: flex; justify-content: space-between; align-items: center; width: 100%; background: #16213e; padding: 10px 15px; border-radius: 8px; }
        .turn-info { font-size: 1.1rem; font-weight: bold; color: #00fff5; }
        
        .players-bar { display: flex; gap: 8px; overflow-x: auto; width: 100%; padding: 8px 0; }
        .p-card { background: #0f3460; border-radius: 6px; padding: 6px 10px; min-width: 100px; border: 2px solid transparent; font-size: 0.85rem; }
        .p-card.active { border-color: #00fff5; box-shadow: 0 0 8px #00fff5; }
        .p-card.skipped { opacity: 0.5; text-decoration: line-through; }
        
        .board-container { position: relative; background: #0f3460; padding: 10px; border-radius: 10px; box-shadow: 0 8px 20px rgba(0,0,0,0.6); margin: 10px 0; }
        .grid-board { display: grid; gap: 2px; background: #16213e; border: 3px solid #e94560; position: relative; }
        
        .cell { background: #1a1a2e; display: flex; align-items: center; justify-content: center; position: relative; font-size: 0.8rem; border-radius: 2px; }
        .cell.out-of-bounds { background: repeating-linear-gradient(45deg, #400, #400 5px, #200 5px, #200 10px); }
        .cell.hole { background: repeating-linear-gradient(135deg, #e94560, #e94560 6px, #800 6px, #800 12px); }
        .cell.speed { background: #00fff533; border: 1px dashed #00fff5; }
        .cell.shield-tile { background: #ffbd3933; border: 1px dashed #ffbd39; }
        .cell.banana-tile { background: #ffe60033; }
        .cell.box-tile { background: #9d00ff33; font-weight: bold; color: #ff00ea; font-size: 1.1rem; }

        .player-token { width: 85%; height: 85%; border-radius: 4px; display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 0.65rem; font-weight: bold; color: #fff; text-shadow: 0 0 3px #000; box-shadow: 0 2px 5px rgba(0,0,0,0.5); z-index: 5; transition: all 0.2s; }
        
        .controls { display: flex; flex-direction: column; align-items: center; gap: 10px; width: 100%; max-width: 400px; background: #16213e; padding: 15px; border-radius: 10px; }
        .dpad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 5px; width: 180px; height: 180px; }
        .dpad-btn { background: #0f3460; border: 2px solid #00fff5; color: #fff; border-radius: 8px; font-size: 1.5rem; display: flex; align-items: center; justify-content: center; cursor: pointer; }
        .dpad-btn:active { background: #00fff5; color: #000; }
        
        .action-btns { display: flex; gap: 10px; width: 100%; }
        .act-btn { flex: 1; padding: 10px; border-radius: 6px; border: none; font-weight: bold; cursor: pointer; color: #fff; font-size: 1rem; }
        .btn-dice { background: #ffbd39; color: #000; }
        .btn-attack { background: #e94560; }
        .btn-attack:disabled { background: #555; opacity: 0.5; }

        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 100; align-items: center; justify-content: center; }
        .modal-content { background: #16213e; padding: 20px; border-radius: 12px; max-width: 400px; width: 90%; text-align: center; border: 2px solid #00fff5; }
    </style>
</head>
<body>

    <h1>🎮 GRID KNOCKOUT</h1>

    <!-- Setup Screen -->
    <div id="setupScreen" class="setup-container">
        <h2>ตั้งค่าเกม</h2>
        <br>
        <div class="form-group">
            <label>โหมดการเล่น:</label>
            <select id="gameMode">
                <option value="original">Original (ดั้งเดิม)</option>
                <option value="lucky" selected>Lucky Battle (สุ่มไอเทม + วงบีบ)</option>
            </select>
        </div>
        <div class="form-group">
            <label>จำนวนผู้เล่น (2-10 คน):</label>
            <input type="number" id="playerCount" value="4" min="2" max="10">
        </div>
        <div class="form-group">
            <label>จำนวนชีวิตเริ่มต้น:</label>
            <input type="number" id="startLives" value="3" min="1" max="10">
        </div>
        <button class="btn-main" onclick="startGame()">เริ่มเล่นเกมเลย!</button>
    </div>

    <!-- Main Game Area -->
    <div id="gameScreen" class="game-layout" style="display: none;">
        <div class="top-bar">
            <div id="turnDisplay" class="turn-info">ตาของ: Player 1</div>
            <div id="diceDisplay" style="font-size: 1.2rem; color: #ffbd39; font-weight: bold;">เต๋า: -</div>
        </div>

        <div id="playersBar" class="players-bar"></div>

        <div class="board-container">
            <div id="board" class="grid-board"></div>
        </div>

        <div class="controls">
            <div id="statusMessage" style="color: #00fff5; font-size: 0.9rem; text-align: center; height: 1.2rem;"></div>
            
            <div class="action-btns">
                <button id="rollDiceBtn" class="act-btn btn-dice" onclick="rollDice()">🎲 ทอยเต๋า</button>
                <button id="attackBtn" class="act-btn btn-attack" onclick="performAttack()" disabled>🥊 ตบด้านหน้า</button>
            </div>

            <div class="dpad">
                <div></div>
                <button class="dpad-btn" onclick="move('up')">▲</button>
                <div></div>
                <button class="dpad-btn" onclick="move('left')">◀</button>
                <div></div>
                <button class="dpad-btn" onclick="move('right')">▶</button>
                <div></div>
                <button class="dpad-btn" onclick="move('down')">▼</button>
                <div></div>
            </div>
        </div>
    </div>

    <!-- Modal Item Popup -->
    <div id="modal" class="modal">
        <div class="modal-content">
            <h2 id="modalTitle" style="color: #00fff5; margin-bottom: 10px;"></h2>
            <p id="modalBody" style="margin-bottom: 20px; font-size: 1rem;"></p>
            <button class="btn-main" onclick="closeModal()">ตกลง</button>
        </div>
    </div>

    <script>
        const COLORS = ['#e94560', '#00fff5', '#ffbd39', '#9d00ff', '#ff00ea', '#00ff66', '#ff8800', '#0099ff', '#ffff00', '#ffffff'];
        let config = { mode: 'lucky', cols: 11, rows: 9, startLives: 3, totalPlayers: 4 };
        let players = [], currentPlayerIdx = 0, stepsLeft = 0, isRolled = false;
        let holes = [], speedTiles = [], shieldTiles = [], itemBoxes = [], bananas = [];
        let shrinkLevel = 0, turnCounter = 0;

        function startGame() {
            config.mode = document.getElementById('gameMode').value;
            config.totalPlayers = parseInt(document.getElementById('playerCount').value);
            config.startLives = parseInt(document.getElementById('startLives').value);

            document.getElementById('setupScreen').style.display = 'none';
            document.getElementById('gameScreen').style.display = 'flex';

            initGame();
        }

        function initGame() {
            players = [];
            for (let i = 0; i < config.totalPlayers; i++) {
                players.push({
                    id: i,
                    name: `P${i+1}`,
                    color: COLORS[i % COLORS.length],
                    lives: config.startLives,
                    x: Math.floor(Math.random() * config.cols),
                    y: Math.floor(Math.random() * config.rows),
                    items: [],
                    shield: false,
                    skipped: false
                });
            }

            generateHoles();
            if (config.mode === 'lucky') spawnLuckyElements();
            renderBoard();
            updateUI();
        }

        function generateHoles() {
            holes = [];
            let holeCount = Math.floor(Math.random() * 9) + 4; // 4 - 12 holes
            while (holes.length < holeCount) {
                let hx = Math.floor(Math.random() * config.cols);
                let hy = Math.floor(Math.random() * config.rows);
                if (!holes.some(h => h.x === hx && h.y === hy)) {
                    holes.push({ x: hx, y: hy });
                }
            }
        }

        function spawnLuckyElements() {
            speedTiles = [{ x: 2, y: 2 }, { x: 8, y: 6 }];
            shieldTiles = [{ x: 5, y: 4 }];
            itemBoxes = [{ x: 3, y: 5 }, { x: 7, y: 3 }];
        }

        function renderBoard() {
            const board = document.getElementById('board');
            board.style.gridTemplateColumns = `repeat(${config.cols}, 35px)`;
            board.style.gridTemplateRows = `repeat(${config.rows}, 35px)`;
            board.innerHTML = '';

            for (let r = 0; r < config.rows; r++) {
                for (let c = 0; c < config.cols; c++) {
                    const cell = document.createElement('div');
                    cell.className = 'cell';

                    // Check bounds (Shrinking map)
                    if (c < shrinkLevel || c >= config.cols - shrinkLevel || r < shrinkLevel || r >= config.rows - shrinkLevel) {
                        cell.classList.add('out-of-bounds');
                    } else if (holes.some(h => h.x === c && h.y === r)) {
                        cell.classList.add('hole');
                    } else if (config.mode === 'lucky') {
                        if (speedTiles.some(s => s.x === c && s.y === r)) cell.classList.add('speed');
                        if (shieldTiles.some(s => s.x === c && s.y === r)) cell.classList.add('shield-tile');
                        if (itemBoxes.some(b => b.x === c && b.y === r)) { cell.classList.add('box-tile'); cell.innerText = '?'; }
                    }

                    // Render players
                    players.forEach(p => {
                        if (p.lives > 0 && p.x === c && p.y === r) {
                            const token = document.createElement('div');
                            token.className = 'player-token';
                            token.style.background = p.color;
                            token.innerText = p.name;
                            cell.appendChild(token);
                        }
                    });

                    board.appendChild(cell);
                }
            }
        }

        function rollDice() {
            if (isRolled) return;
            stepsLeft = Math.floor(Math.random() * 6) + 1;
            isRolled = true;
            document.getElementById('diceDisplay').innerText = `เต๋า: 🎲 ${stepsLeft}`;
            document.getElementById('rollDiceBtn').disabled = true;
            checkAttackPossibility();
        }

        function move(dir) {
            if (!isRolled || stepsLeft <= 0) return;
            let p = players[currentPlayerIdx];
            let nx = p.x, ny = p.y;

            if (dir === 'up') ny--;
            if (dir === 'down') ny++;
            if (dir === 'left') nx--;
            if (dir === 'right') nx++;

            p.x = nx;
            p.y = ny;
            stepsLeft--;

            // Check if stepped out of bounds or into hole
            if (nx < shrinkLevel || nx >= config.cols - shrinkLevel || ny < shrinkLevel || ny >= config.rows - shrinkLevel || holes.some(h => h.x === nx && h.y === ny)) {
                p.lives = 0;
                showModal('💀 ตกสนามตาย!', `${p.name} ตกหลุม/ขอบสนามเสียชีวิตแล้ว!`);
                stepsLeft = 0;
            }

            // Lucky Item check
            if (config.mode === 'lucky' && p.lives > 0) {
                let boxIdx = itemBoxes.findIndex(b => b.x === nx && b.y === ny);
                if (boxIdx !== -1) {
                    itemBoxes.splice(boxIdx, 1);
                    grantRandomItem(p);
                }
            }

            document.getElementById('diceDisplay').innerText = `เหลืออีก: ${stepsLeft} ก้าว`;
            renderBoard();

            if (stepsLeft === 0) {
                checkAttackPossibility();
                if (!document.getElementById('attackBtn').disabled) return;
                nextTurn();
            }
        }

        function grantRandomItem(p) {
            let items = ['shield', 'bomb', 'heart', 'magnet', 'banana', 'skip'];
            let item = items[Math.floor(Math.random() * items.length)];

            // Secret auto-reroll for 1 life players getting bombs
            if (p.lives === 1 && item === 'bomb') {
                item = 'shield';
            }

            if (item === 'bomb') {
                p.lives--;
                showModal('💣 โชคร้ายเจอระเบิด!', `${p.name} โดนระเบิดลดชีวิตลง 1 ดวง!`);
            } else if (item === 'heart') {
                p.lives++;
                showModal('❤️ ได้รับหัวใจ!', `${p.name} ฟื้นฟูชีวิตขึ้น 1 ดวง!`);
            } else {
                showModal('🎁 ได้รับไอเทม!', `${p.name} ได้รับไอเทมพิเศษประเภท: ${item.toUpperCase()}`);
            }
        }

        function checkAttackPossibility() {
            let p = players[currentPlayerIdx];
            let canAttack = false;
            if (stepsLeft === 0 && isRolled) {
                players.forEach(target => {
                    if (target.id !== p.id && target.lives > 0) {
                        let dx = Math.abs(target.x - p.x);
                        let dy = Math.abs(target.y - p.y);
                        if ((dx === 1 && dy === 0) || (dx === 0 && dy === 1)) {
                            canAttack = true;
                        }
                    }
                });
            }
            document.getElementById('attackBtn').disabled = !canAttack;
        }

        function performAttack() {
            let p = players[currentPlayerIdx];
            players.forEach(target => {
                if (target.id !== p.id && target.lives > 0) {
                    let dx = target.x - p.x;
                    let dy = target.y - p.y;
                    if (Math.abs(dx) + Math.abs(dy) === 1) {
                        // Knockback
                        target.x += dx;
                        target.y += dy;
                        target.lives--;

                        // Check knockback death
                        if (target.x < shrinkLevel || target.x >= config.cols - shrinkLevel || target.y < shrinkLevel || target.y >= config.rows - shrinkLevel || holes.some(h => h.x === target.x && h.y === target.y)) {
                            target.lives = 0;
                            showModal('🥊 ตบตกสนาม!', `${target.name} โดน ${p.name} ตบกระเด็นตกหลุมตายทันที!`);
                        } else {
                            showModal('🥊 โดนตบกระเด็น!', `${target.name} โดน ${p.name} ตบกระเด็นถอยหลัง 1 ช่อง และเสีย 1 ชีวิต!`);
                        }
                    }
                });
            renderBoard();
            nextTurn();
        }

        function nextTurn() {
            isRolled = false;
            document.getElementById('rollDiceBtn').disabled = false;
            document.getElementById('attackBtn').disabled = true;

            do {
                currentPlayerIdx = (currentPlayerIdx + 1) % players.length;
            } while (players[currentPlayerIdx].lives <= 0);

            turnCounter++;
            if (turnCounter % (players.length * 4) === 0 && config.mode === 'lucky') {
                shrinkLevel++;
                generateHoles();
                showModal('⚠️ เตือนวงบีบ!', 'สนามกำลังบีบตัวและสลับตำแหน่งหลุมใหม่!');
            }

            updateUI();
            renderBoard();
        }

        function updateUI() {
            let p = players[currentPlayerIdx];
            document.getElementById('turnDisplay').innerText = `ตาของ: ${p.name}`;
            document.getElementById('turnDisplay').style.color = p.color;

            let pBar = document.getElementById('playersBar');
            pBar.innerHTML = '';
            players.forEach(pl => {
                let card = document.createElement('div');
                card.className = `p-card ${pl.id === p.id ? 'active' : ''}`;
                card.style.borderColor = pl.color;
                card.innerHTML = `<strong>${pl.name}</strong><br>❤️ ${pl.lives}`;
                pBar.appendChild(card);
            });
        }

        function showModal(title, body) {
            document.getElementById('modalTitle').innerText = title;
            document.getElementById('modalBody').innerText = body;
            document.getElementById('modal').style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('modal').style.display = 'none';
        }
    </script>
</body>
</html>
